services:
  - type: web
    name: apix-api
    runtime: python
    plan: free
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build && pip install -r requirements.txt && playwright install chromium --with-deps
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
